name: SWEEP review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: sweep-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sweep:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body, '/sweep') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SWEEP_TEST_EMAIL: test@localhost.local
      SWEEP_TEST_PASSWORD: testInfisical@1
      SWEEP_TEST_ORG: Sweep Test Org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build-graph.mjs and where-to-test.mjs diff base against head locally,
      # so both commits have to exist in this clone.
      - name: Fetch the PR head
        run: |
          git fetch --no-tags --force origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}"

      # Claude Code only discovers skills under .claude/skills.
      - name: Stage the repo skills
        run: |
          mkdir -p .claude/skills
          cp -R agent/skills/. .claude/skills/

      # Northflank posts "Infisical preview is up: https://p01--infisical--<id>.code.run"
      # once the PR build deploys. Take the newest one: a redeploy posts a new comment
      # and the old host stops resolving.
      - name: Resolve the preview URL
        id: preview
        run: |
          url=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
                  --jq '.[] | select((.user.login // "") | startswith("northflank-cloud-build-run")) | .body' \
                | grep -oE 'https://p01--infisical--[a-z0-9]+\.code\.run' \
                | tail -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::no Northflank preview comment on PR #${PR_NUMBER}; the live test will be skipped"
          else
            echo "preview: $url"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.preview.outputs.url != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('agent/skills/sweep/local/package-lock.json') }}

      - name: Install the live-test runner
        if: steps.preview.outputs.url != ''
        working-directory: agent/skills/sweep/local
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the preview
        if: steps.preview.outputs.url != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          for i in $(seq 1 40); do
            curl -sf "$BASE_URL" >/dev/null && exit 0
            sleep 5
          done
          echo "::error::preview at $BASE_URL did not respond"
          exit 1

      # Best effort. A preview that Northflank already seeded returns a non-200 here,
      # which is fine: the account exists either way.
      - name: Bootstrap the test account
        if: steps.preview.outputs.url != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          code=$(curl -s -o /tmp/sweep-bootstrap.json -w '%{http_code}' \
                   -X POST "$BASE_URL/api/v1/admin/bootstrap" \
                   -H 'content-type: application/json' \
                   -d "$(jq -nc \
                         --arg e "$SWEEP_TEST_EMAIL" \
                         --arg p "$SWEEP_TEST_PASSWORD" \
                         --arg o "$SWEEP_TEST_ORG" \
                         '{email:$e, password:$p, organization:$o}')")
          if [ "$code" = 200 ]; then
            echo "bootstrapped a fresh instance"
          else
            echo "::notice::bootstrap returned $code, assuming the account already exists"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "/sweep"
          track_progress: true
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,Task,WebFetch,TodoWrite
          prompt: |
            Run the SWEEP skill on pull request #${{ github.event.issue.number || github.event.pull_request.number }}
            in ${{ github.repository }}.

            You are running inside GitHub Actions on an ubuntu-latest runner.

            1. You have explicit permission, for this turn, to post the review to the PR:
               the sticky summary behind <!-- sweep-summary -->, the batched inline
               comments, and the "where to test this" comment. Do not submit a GitHub
               review event (--approve or --request-changes) and do not push commits.

            2. Live test target: "${{ steps.preview.outputs.url }}"

               If that is empty, no Northflank preview was found for this PR. Skip the
               live test and say in the review that the change was not exercised and why.

               If it is set, that is the deployed PR build and it is already running.
               Skip step 2 of references/live-testing.md entirely: do not switch
               branches, do not run docker compose, do not start a tunnel. Use it as
               baseUrl in the plan and drive it with the local runner, which runs a
               browser here and reaches the preview over the public internet:

                 node agent/skills/sweep/local/run.mjs /tmp/sweep-plan.json --out /tmp/sweep-${{ github.event.issue.number || github.event.pull_request.number }}

            3. Log in with test@localhost.local / testInfisical@1. That account is the
               instance super admin, so it may be the only actor present. Any probe that
               calls for a low-privilege actor needs you to create one first, and if you
               do not, say the permission probe was not run.

            4. The local runner writes artifacts to disk, not to postable URLs, so you
               cannot embed frames in a comment. Do not link to any local path and do not
               embed an image you have not verified returns 200. Describe in prose what
               each frame showed, and say the artifacts are attached to the workflow run.

            5. gh is already authenticated against ${{ github.repository }}, so skip the
               gh repo set-default check.

            The preview is a public URL and these credentials are shared, so treat every
            frame as public. Add the login form's password field to redactSelectors in
            the plan, and check each frame before you describe it.

      - name: Upload live-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-evidence-${{ github.event.issue.number || github.event.pull_request.number }}
          path: /tmp/sweep-*
          if-no-files-found: ignore
          retention-days: 14
